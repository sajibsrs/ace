<text x="550" y="150.0" font-size="13" fill="#888" text-anchor="end">clang++ -O2</text>
<rect x="560" y="132" width="276.0" height="26" rx="2" fill="#8b8f98"/>
<text x="842.0" y="150.0" font-size="13" font-weight="600" fill="#8b8f98">120.8 s</text>
<text x="550" y="186.0" font-size="13" fill="#888" text-anchor="end">rustc -O2</text>
<rect x="560" y="168" width="29.2" height="26" rx="2" fill="#8b8f98"/>
<text x="595.2" y="186.0" font-size="13" font-weight="600" fill="#8b8f98">12.8 s</text>
</svg>
